window.addapplicant = async function () {

 const name = document.getElementById("name").value;
  const nbr = document.getElementById("nbr").value;
  const nat = document.getElementById("nat").value;
  const phn = document.getElementById("phn").value;
  const adr = document.getElementById("adr").value;
  const prp = document.getElementById("prp").value;
  const sta = document.getElementById("sta").value; 
  const rqd = document.getElementById("rqd").value;
  const apd = document.getElementById("apd").value; 
   
 // const ownerId = document.getElementById("name").value;

  if (name === "" || nbr === "" || nat === "" || phn === "" || rqd === "" || apd === "" || adr === "" || prp === "" || sta === ""){
    alert("Please Enter all Manadatory datas of the Applicant");
    return;
  }

if (!isValidSelection("nat", "nats")) {
  alert("A valid Nationality not selected from the list.");
  return;
}


if (!isValidSelection("prp", "prps")) {
  alert("A valid Consultation Purpose not selected from the list.");
  return;
}

if (!isValidSelection("sta", "stas")) {
  alert("A valid request status not selected from the list.");
  return;
}



   
  try {

    // 🔹 Use nbr as document ID
    const docRef = doc(db, "appttable", nbr.toString());

    // 🔹 Check if document already exists
    const existingDoc = await getDoc(docRef);

    if (existingDoc.exists()) {
      alert("Consultation Request already exists!");
      return;
    }

    // 🔹 Create document with nbr as ID
    await setDoc(docRef, {
      name: name,
      nbr: parseInt(nbr),
      phn: parseInt(phn),
      nat: nat,
      adr: adr,
      prp: prp,
      sta: sta,
      rqd: rqd,
      apd: apd,
   //   ownerId: ownerId,
   //   createdAt: serverTimestamp()
      // createdAt: new Date()
    });

    alert("Consultation request added to Cloud Firestore!");
    clearInputs();
    loadappttable(); // refresh table

  } catch (error) {
    console.error("Error adding Consultation request:", error);
    alert("Error adding item. Check console.");
  }
};

function isValidDate(expiry) {
  // Check format using Regular Expression (YYYY-MM-DD)
//  const regex = /^\d{4}-(0[1-9]|1[0-2])$/;
   const regex = /^\d{4}-\d{2}-\d{2}$/;
  if (!regex.test(expiry)) {
    return false; // Invalid format
  }


}






function isValidSelection(inputId, datalistId) {
  const input = document.getElementById(inputId).value;
  const options = document.querySelectorAll(`#${datalistId} option`);

  const validValues = Array.from(options).map(opt => opt.value);

  return validValues.includes(input);
}
