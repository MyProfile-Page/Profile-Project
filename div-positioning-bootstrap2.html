<!DOCTYPE html>
<html lang="en">
<head>


  <title>Bootstrap Outer & Inner Divs</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="div-positioning-bootstrap2-styles.css" />
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

  <!-- 🔷 OUTER DIV -->
  <div class="container my-4">

    <!-- 🔹 ROW (layout controller) -->
    <div class="row" style="border: 1px solid red;">  

      <!-- 🔸 INNER DIV 1 -->
    <div class="col-12 col-md-6 col-lg-4 p-3 bg-light border" style="margin-left:0%; width:90%;">

       <div id = "div1" style="border: 1px solid green; width: 20%; display: inline-block; vertical-align: top;  ">
        <p style="padding-left: 5%; font-size: clamp(0.8rem, 1.0vw, 1.1rem); ">
        Box 1
              
          Full width on mobile
          Half width on tablet
          One-third on desktop
        </p>
        </div>

        <div  id = "div2" style="border: 1px solid yellow;  display: inline-block; vertical-align :top;  ">
            <img src="thumb-rose1.JPG" class="img-fluid;">  
           <div class="gap10vh"></div>
            <img src="thumb-rose1.JPG" class="img-fluid;">          
         </div>  

       <div  id = "div3" style="border: 1px solid yellow;  display: inline-block; vertical-align :top; width: 20%;  ">
        <p style="padding-left: 5%; font-size: clamp(0.8rem, 1.0vw, 1.1rem); ">
        Box 2
            
          Full width on mobile
          Half width on tablet
          One-third on desktop
        </p>
        </div>

         <div  id = "div4" style="border: 1px solid yellow; width: 20%;   ">
       <p style="padding-left: 5%; font-size: clamp(0.8rem, 1.0vw, 1.1rem); ">
        Box 3
            
          Full width on mobile
          Half width on tablet
          One-third on desktop
        </p>
        </div>

         
 
    </div>
   
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
