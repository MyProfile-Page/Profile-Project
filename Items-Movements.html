<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  query,
  orderBy,
  addDoc, 
  setDoc,
  getDocs, 
  getDoc,
  deleteDoc, 
  doc,
  updateDoc,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCPjQ6I6XZ2EZGNRFi_1iQYZv5tjYFGdfk",
  authDomain: "smart-appl-pr.firebaseapp.com",
  projectId: "smart-appl-pr",
  storageBucket: "smart-appl-pr.firebasestorage.app",
  messagingSenderId: "491870622637",
  appId: "1:491870622637:web:5364e766463c77c3094724"
};



  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app); 

let firsttime = "yes";
let newinvnbr = 0;

  // 🔹 READ (Load Data into Table)
async function loadnewitemstable() {

  const table = document.getElementById("itemTable");
  
  table.innerHTML = "";
  const collectionRef = collection(db, "newitemstable");
  const q = query(collectionRef, orderBy("nbr", "asc"));

  const querySnapshot = await getDocs(q);

  let grandTotalCents = 0; // ✅ accumulator for grand total

  querySnapshot.forEach((document) => {
    const data = document.data();
    const docId = document.id;

    // Price (cents → dollars)
    const dollarprice = formatCentsToDollars(data.prc);

    // Row total (qty × price in cents)
    const centvalue = calculatevalueincent(data.qty, data.prc);
    const dollarvalue = formatCentsToDollars(centvalue);
    // Add to grand total (SAFE integer math)
    grandTotalCents += centvalue;

 //   const displayTotal = formatCentsToDollars(grandTotalCents);
    
    table.innerHTML += `
      
      <tr class="tr-main-row"  >
        <td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.8rem, 1.1vw, 1.2rem); font-weight: 400;">${data.nbr}</td>
        
        <td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.8rem, 1.1vw, 1.2rem); font-weight: 400; padding-left: 0.2vw;">${data.name}</td>
        
        <td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.8rem, 1.1vw, 1.2rem); font-weight: 400;">${data.qty}</td>
        <td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.8rem, 1.1vw, 1.2rem); font-weight: 400;">$${dollarvalue}</td>
        
        
        <td style="border: 0.05vw solid black; text-align: center;">

          <button onclick="edititem('${docId}', '${data.name}', '${data.nbr}', '${data.qty}')" class = "edit-delt-btn";>Select</button>
          
        </td>          
        
      </tr>

    
    `;
  });

     // ✅ Convert grand total cents to dollars
  const grandTotalDollar = formatCentsToDollars(grandTotalCents);

  // ✅ Calculate Tax (example 13%)
  const taxRate = 0.13;
  const taxCents = Math.round(grandTotalCents * taxRate);
  const taxDisplay = formatCentsToDollars(taxCents);

  // ✅ Net Total
  const netTotalCents = grandTotalCents + taxCents;
  const netTotalDisplay = formatCentsToDollars(netTotalCents);

  // ✅ Add Summary Rows (ALL TOGETHER)
  table.innerHTML += `
    <tr></tr>
   <tr class="tr-tl-row" ">
      <td colspan="3" style="text-align: center; border: 0.0vw solid black; font-size: clamp(0.6rem, 0.9vw, 1.1rem); font-weight: 450;">Total Value</td>
      <td style="text-align: center; border: 0.0vw solid black; font-size: clamp(0.6rem, 0.9vw, 1.1rem); font-weight: 450;">$${grandTotalDollar}</td>
      <td colspan="1" style="text-align: right; border: 0.0vw solid black;"></td>

function calculatevalueincent(qty, prc) {
  const q = parseInt(qty) || 0;
  const p = parseInt(prc) || 0;
  return q * p; // stays in cents (safe, no floating errors)
}

// Tax calculation functions

function calculateTaxCents(grandTotalCents, taxPercent) {
  const taxRate = parseFloat(taxPercent) || 0;
  return Math.round((grandTotalCents * taxRate) / 100);
}

function calculateNetTotalCents(grandTotalCents, taxCents) {
  return grandTotalCents + taxCents;
}

async function loadDatalistcodes() {

      option.value = data.name; // change field as needed

    });

  }

async function getNextInvoiceNumber(iser) {
  const docRef = doc(db, "iref", iser.toString());

  try {
    const newNumber = await runTransaction(db, async (transaction) => {
      const docSnap = await transaction.get(docRef);

      if (!docSnap.exists()) {
        throw "Document does not exist!";
      }

      const current = docSnap.data().inbr || 0;
      const next = current + 1;

      transaction.update(docRef, {
        inbr: next,
        createdAt: serverTimestamp()
      });

      return next; // 🔹 this comes out of the transaction
    });

    console.log("New invoice number:", newNumber);
    localStorage.setItem("lsinvnbr", newNumber);

    return newNumber;

  } catch (error) {
    console.error("Transaction failed:", error);
    alert("Failed to generate invoice number.");
  }
}
