<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  query,
  orderBy,
  addDoc, 
  setDoc,
  getDocs, 
  getDoc,
  deleteDoc, 
  doc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCPjQ6I6XZ2EZGNRFi_1iQYZv5tjYFGdfk",
  authDomain: "smart-appl-pr.firebaseapp.com",
  projectId: "smart-appl-pr",
  storageBucket: "smart-appl-pr.firebasestorage.app",
  messagingSenderId: "491870622637",
  appId: "1:491870622637:web:5364e766463c77c3094724"
};



  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app); 


  // 🔹 READ (Load Data into Table)
async function loadmanfsupltable() {

  const table = document.getElementById("manfsupltable");
  
  table.innerHTML = "";
  const collectionRef = collection(db, "mnspdatalist");
  const q = query(collectionRef, orderBy("nbr", "asc"));
  
  const querySnapshot = await getDocs(q);

  let grandTotalCents = 0; // ✅ accumulator for grand total

  querySnapshot.forEach((document) => {
    const data = document.data();
    const docId = document.id;

   
    table.innerHTML += `
      
      <tr class="tr-main-row"  >
       
        
        <td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400; padding-left: 0.5vw;">${data.nbr}</td>
<td style="border-top: 0.05vw solid black; border-right: 0.05vw solid black; font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400; padding-left: 0.5vw;">${data.name}</td>
                <td style="border: 0.05vw solid black; text-align: center;">

           <button onclick="deleteitem('${docId}')" class="edit-delt-btn">Delete</button>
        </td>  
          
        </td>          
        
      </tr>
<tr>
</tr>

    
    `;
  });

     }   // ✅ ONLY ONE closing bracket for function





 // Clear input fields
  window.clearInputs = async function () {
  
    
    document.getElementById("nbr").value = "";
    document.getElementById("name").value = "";
   

  }




 




// Fill inputs when Edit button is clicked
window.edititem = function (id, name) {
  
  document.getElementById("name").value = name;
  
  
 
  


  // Store document ID for update
  window.currentEditId = id;
};

 // 🔹 DELETE (Remove Record)
  window.deleteitem = async function (id) {
    await deleteDoc(doc(db, "mnspdatalist", id));
    alert("Manufacturer/Supplier deleted");
    clearInputs();
    loadmanfsupltable();
  };

// 🔹 CREATE (Insert Data)
window.additem = async function () {

  const nbr = document.getElementById("nbr").value;
  const name = document.getElementById("name").value;
     
  try {

    // 🔹 Use nbr as document ID
     const docRef = doc(db, "mnspdatalist", nbr.toString());
    

    // 🔹 Check if document already exists
 //   const existingDoc = await getDoc(docRef);

   

    // 🔹 Create document with nbr as ID
    await setDoc(docRef, {
      nbr: parseInt(nbr, 10),
      name: name,     
      createdAt: serverTimestamp()
      // createdAt: new Date()
    });

    alert("Manufacturer/Supplier added");
    
    loadmanfsupltable(); // refresh table

  } catch (error) {
    console.error("Error adding Manufacturer/Supplier:", error);
    alert("Error adding Manufacturer/Supplier. Check console.");
  }
};

  
  loadmanfsupltable();





</script>
