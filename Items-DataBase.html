<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  query,
  orderBy,
  addDoc, 
  setDoc,
  getDocs, 
  getDoc,
  deleteDoc, 
  doc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyCPjQ6I6XZ2EZGNRFi_1iQYZv5tjYFGdfk",
  authDomain: "smart-appl-pr.firebaseapp.com",
  projectId: "smart-appl-pr",
  storageBucket: "smart-appl-pr.firebasestorage.app",
  messagingSenderId: "491870622637",
  appId: "1:491870622637:web:5364e766463c77c3094724"
};



  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  

  


// 🔹 CREATE (Insert Data)
window.additem = async function () {

  const name = document.getElementById("name").value;
  const nbr = document.getElementById("nbr").value;
  const uis = document.getElementById("uis").value;
  const qty = document.getElementById("qty").value;
  const prc = document.getElementById("prc").value;
  const ctg = document.getElementById("ctg").value;
  const sup = document.getElementById("sup").value;
  const imp = document.getElementById("imp").value;
  const con = document.getElementById("con").value; 
   
  const ownerId = document.getElementById("name").value;

  if (name === "" || nbr === "" || uis === "" || qty === "" || prc === "" || ctg === "" || sup === "" || imp === "" || con === ""){
    alert("Please Enter all Manadatory data of the item");
    return;
  }

const expiryInput = document.getElementById("exp").value.trim();
if (expiryInput !== "") {
  if (!isValidDate(expiryInput)) {
    alert("Please Enter a valid Expiry Date of Item in YYYY-MM-DD format (e.g. 2026-03-31)");
    return; // Stop update if invalid
  }
}
 const exp = expiryInput;
// const exp = expiryInput === "" ? null : expiryInput;

const fmdInput = document.getElementById("fmd").value.trim();
if (fmdInput !== "") {
  if (!isValidDate(fmdInput)) {
    alert("Please Enter a valid last Movement Date of Item in YYYY-MM-DD format (e.g. 2026-03-31)");
    return; // Stop update if invalid
  }
}
 const fmd = fmdInput;
// const fmd = fmdInput === "" ? null : fmdInput;

// const rol = document.getElementById("rol").value; 
// const mnl = document.getElementById("mnl").value; 


 const rol = document.getElementById("rol").value === "" ? null : document.getElementById("rol").value;
 const mnl = document.getElementById("mnl").value === "" ? null : document.getElementById("mnl").value;


   
  try {

    // 🔹 Use nbr as document ID
    const docRef = doc(db, "newitemstable", nbr.toString());

    // 🔹 Check if document already exists
    const existingDoc = await getDoc(docRef);

    if (existingDoc.exists()) {
      alert("Item number already exists!");
      return;
    }

    // 🔹 Create document with nbr as ID
    await setDoc(docRef, {
      name: name,
      nbr: parseInt(nbr),
      qty: parseInt(qty),
      prc: parseInt(prc),
      uis: uis,
      ctg: ctg,
      sup: sup,
      imp: imp,
      con: con,
      rol: rol,
      mnl: mnl,
      exp: exp,
      fmd: fmd,
      ownerId: ownerId,
      createdAt: serverTimestamp()
      // createdAt: new Date()
    });

    alert("Item added to Cloud Firestore!");
    clearInputs();
    loadnewitemstable(); // refresh table

  } catch (error) {
    console.error("Error adding item:", error);
    alert("Error adding item. Check console.");
  }
};
  // 🔹 READ (Load Data into Table)
async function loadnewitemstable() {

  const table = document.getElementById("itemTable");

function formatCentsToDollars(cents) {
  return (cents / 100).toFixed(2);
}

// 🔹 Itenm Value calculate func


function calculatevalueincent(qty, prc) {
  const q = parseInt(qty) || 0;
  const p = parseInt(prc) || 0;
  return q * p; // stays in cents (safe, no floating errors)
}

// Tax calculation functions

function calculateTaxCents(grandTotalCents, taxPercent) {
  const taxRate = parseFloat(taxPercent) || 0;
  return Math.round((grandTotalCents * taxRate) / 100);
}

function calculateNetTotalCents(grandTotalCents, taxCents) {
  return grandTotalCents + taxCents;
}



function isValidDate(expiry) {
  // Check format using Regular Expression (YYYY-MM-DD)
//  const regex = /^\d{4}-(0[1-9]|1[0-2])$/;
   const regex = /^\d{4}-\d{2}-\d{2}$/;
  if (!regex.test(expiry)) {
    return false; // Invalid format
  }

  // Optional: check if it is a real calendar date
  const [year, month] = expiry.split("-").map(Number);

  const date = new Date(year, month - 1); // month is 0-based in JS

  // Ensure parsed values match input
  return date.getFullYear() === year && date.getMonth() === month - 1;
}

function clean(value) {
  return (value === null || 
          value === "null" || 
          value === "NaN" ||
          value === "undefined" || 
          value === "NaN" ||
          (typeof value === "number" && isNaN(value)))
         ? "" 
         : value;
}


function cleanrol(valuerol, valueqty) {
  return (valuerol === null || 
          valuerol === "null" || 
          valuerol === "NaN" ||
          valuerol === "undefined" || 
          valuerol === "NaN" ||
          (typeof valuerol === "number" && isNaN(valuerol)))
         ? "" 
         : valuerol;

  if (valueqty < valuerol) {
    return "<span style='color:red;'>" + cleanrol + "</span>";
  }

  return cleanrol;
}
