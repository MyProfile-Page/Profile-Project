function formatCentsToDollars(cents) {
  return (cents / 100).toFixed(2);
}

// 🔹 Itenm Value calculate func


function calculatevalueincent(qty, prc) {
  const q = parseInt(qty) || 0;
  const p = parseInt(prc) || 0;
  return q * p; // stays in cents (safe, no floating errors)
}

// Tax calculation functions

function calculateTaxCents(grandTotalCents, taxPercent) {
  const taxRate = parseFloat(taxPercent) || 0;
  return Math.round((grandTotalCents * taxRate) / 100);
}

function calculateNetTotalCents(grandTotalCents, taxCents) {
  return grandTotalCents + taxCents;
}



function isValidDate(expiry) {
  // Check format using Regular Expression (YYYY-MM-DD)
//  const regex = /^\d{4}-(0[1-9]|1[0-2])$/;
   const regex = /^\d{4}-\d{2}-\d{2}$/;
  if (!regex.test(expiry)) {
    return false; // Invalid format
  }

  // Optional: check if it is a real calendar date
  const [year, month] = expiry.split("-").map(Number);

  const date = new Date(year, month - 1); // month is 0-based in JS

  // Ensure parsed values match input
  return date.getFullYear() === year && date.getMonth() === month - 1;
}

function clean(value) {
  return (value === null || 
          value === "null" || 
          value === "NaN" ||
          value === "undefined" || 
          value === "NaN" ||
          (typeof value === "number" && isNaN(value)))
         ? "" 
         : value;
}


function cleanrol(valuerol, valueqty) {
  return (valuerol === null || 
          valuerol === "null" || 
          valuerol === "NaN" ||
          valuerol === "undefined" || 
          valuerol === "NaN" ||
          (typeof valuerol === "number" && isNaN(valuerol)))
         ? "" 
         : valuerol;

  if (valueqty < valuerol) {
    return "<span style='color:red;'>" + cleanrol + "</span>";
  }

  return cleanrol;
}

function isValidSelection(inputId, datalistId) {
  const input = document.getElementById(inputId).value;
  const options = document.querySelectorAll(`#${datalistId} option`);

  const validValues = Array.from(options).map(opt => opt.value);

  return validValues.includes(input);
}
