// 🔹 CREATE (Insert Data)
window.additem = async function () {

  const name = document.getElementById("name").value;
  const nbr = document.getElementById("nbr").value;
  const uis = document.getElementById("uis").value;
  const qty = document.getElementById("qty").value;
  const prc = document.getElementById("prc").value;
  const exp = document.getElementById("exp").value;
  const ctg = document.getElementById("ctg").value;
  const sup = document.getElementById("sup").value;
  const imp = document.getElementById("imp").value;
  const con = document.getElementById("con").value;
  const rol = document.getElementById("rol").value;
  const mnl = document.getElementById("mnl").value;
  const lmd = document.getElementById("lmd").value;  
  const ownerId = document.getElementById("name").value;

  if (name === "" || nbr === "" || uis === "" || qty === "" || prc === "" || exp === "" || ctg === "" || sup === "" || imp === "" || con === ""){
    alert("Please fill all Manadatory fields");
    return;
  }

  const expiryInput = document.getElementById("exp").value.trim();

  if (!isValidExpiryDate(expiryInput)) {
    alert("Please enter a valid expiry date in YYYY-MM format (e.g. 2026-03)");
    return; // Stop update if invalid
  }




  try {

    // 🔹 Use nbr as document ID
    const docRef = doc(db, "newitemstable", nbr.toString());

    // 🔹 Check if document already exists
    const existingDoc = await getDoc(docRef);

    if (existingDoc.exists()) {
      alert("Item number already exists!");
      return;
    }

    // 🔹 Create document with nbr as ID
    await setDoc(docRef, {
      name: name,
      nbr: parseInt(nbr),
      qty: parseInt(qty),
      prc: parseInt(prc),
      uis: uis,
      exp: exp,
      ctg: ctg,
      sup: sup,
      imp: imp,
      con: con,
      rol: rol,
      mnl: mnl,
      lmd: lmd,
      ownerId: ownerId,
      createdAt: serverTimestamp()
      // createdAt: new Date()
    });

    alert("Item added to Cloud Firestore!");
    clearInputs();
    loadnewitemstable(); // refresh table

  } catch (error) {
    console.error("Error adding item:", error);
    alert("Error adding item. Check console.");
  }
};
  // 🔹 READ (Load Data into Table)
async function loadnewitemstable() {

  const table = document.getElementById("itemTable");
  table.innerHTML = "";

  const collectionRef = collection(db, "newitemstable");
  const q = query(collectionRef, orderBy("nbr", "asc"));

  const querySnapshot = await getDocs(q);

  let grandTotalCents = 0; // ✅ accumulator for grand total

  querySnapshot.forEach((document) => {
    const data = document.data();
    const docId = document.id;

    // Price (cents → dollars)
    const dollarprice = formatCentsToDollars(data.prc);

    // Row total (qty × price in cents)
    const centvalue = calculatevalueincent(data.qty, data.prc);
    const dollarvalue = formatCentsToDollars(centvalue);
    // Add to grand total (SAFE integer math)
    grandTotalCents += centvalue;

 //   const displayTotal = formatCentsToDollars(grandTotalCents);

    table.innerHTML += `
      <tr style="height: 2vh;">
        <td style="font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">${data.nbr}</td>
        <td style="font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">${data.name}</td>
        <td style="font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">${data.sup}</td>
        <td style="font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">${data.uis}</td>
        <td style="font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">${data.qty}</td>
        <td style="font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">$${dollarprice}</td>
        <td style="font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">$${dollarvalue}</td>
        
        <td style="text-align: left; font-size: clamp(0.6rem, 1.0vw, 1.1rem); font-weight: 400;">Category:&nbsp&nbsp${data.ctg}</td>
        
      </tr>

   <tr style="height: 2vh;">
        <td colspan="7" style="border: 0.0vw solid black;"></td>         
        <td style="border: 0.0vw solid black; text-decoration: None; text-align: left; font-size: clamp(0.5rem, 0.8vw, 1.0rem); font-weight: 400;">Durability:&nbsp&nbsp${data.con}</td>
      </tr>

    <tr style="height: 2vh;">
        <td colspan="7" style="border: 0.0vw solid black;"></td>          
        <td style="border: 0.0vw solid black; text-decoration: None; text-align: left; font-size: clamp(0.5rem, 0.8vw, 1.0rem); font-weight: 400;">Importance:&nbsp&nbsp${data.imp}</td>
      </tr>
   

      <tr style="height: 2vh;">
        <td colspan="7" style="border: 0.0vw solid black;"></td>          
        <td style="border: 0.0vw solid black; text-decoration: None; text-align: left; font-size: clamp(0.5rem, 0.8vw, 1.0rem); font-weight: 400;">Reorder levl:&nbsp&nbsp${data.rol}</td>
      </tr>

      <tr style="height: 2vh;"> 
        <td colspan="7" style="border: 0.0vw solid black;"></td>          
        <td style="border: 0.0vw solid black; text-decoration: None; text-align: left; font-size: clamp(0.5rem, 0.8vw, 1.0rem); font-weight: 400;">Minimum levl:&nbsp&nbsp${data.mnl}</td>
      </tr>

       <tr style="height: 2vh;"> 
        <td colspan="7" style="border: 0.0vw solid black;"></td>          
        <td style="border: 0.0vw solid black; text-decoration: None; text-align: left; font-size: clamp(0.5rem, 0.8vw, 1.0rem); font-weight: 400;">Last Mvnt:&nbsp&nbsp${data.lmd}</td>
      </tr>

       <tr style="height: 2vh;">  
        <td colspan="7" style="border: 0.0vw solid black;"></td>         
        <td style="border: 0.0vw solid black; text-decoration: None; text-align: left; font-size: clamp(0.5rem, 0.8vw, 1.0rem); font-weight: 400;">Item Expiry:&nbsp&nbsp${data.exp}</td>
      </tr>

       <tr class="no-print" style="height: 5vh;">

function formatCentsToDollars(cents) {
  return (cents / 100).toFixed(2);
}

// 🔹 Itenm Value calculate func


function calculatevalueincent(qty, prc) {
  const q = parseInt(qty) || 0;
  const p = parseInt(prc) || 0;
  return q * p; // stays in cents (safe, no floating errors)
}

// Tax calculation functions

function calculateTaxCents(grandTotalCents, taxPercent) {
  const taxRate = parseFloat(taxPercent) || 0;
  return Math.round((grandTotalCents * taxRate) / 100);
}

function calculateNetTotalCents(grandTotalCents, taxCents) {
  return grandTotalCents + taxCents;
}

function isValidExpiryDate(expiry) {
  // Check format using Regular Expression (YYYY-MM)
  const regex = /^\d{4}-(0[1-9]|1[0-2])$/;

  if (!regex.test(expiry)) {
    return false; // Invalid format
  }

  // Optional: check if it is a real calendar date
  const [year, month] = expiry.split("-").map(Number);

  const date = new Date(year, month - 1); // month is 0-based in JS

  // Ensure parsed values match input
  return date.getFullYear() === year && date.getMonth() === month - 1;
}
