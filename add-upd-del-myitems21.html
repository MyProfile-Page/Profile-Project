<!DOCTYPE html>
<html>
<head>
  <title>Firestore Table (IIS + Localhost)</title>
 
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
  .body_cls {
          background-color: red;
          background: linear-gradient(to right, #007bff, #00c6ff);
          background: white;
      /*    background: lightblue;    */
          line-height: 0.8;         
            }

.navbar-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  color: lightblue;
font-size: clamp(1.1rem, 1.4vw, 1.5rem); 
font-weight: 750;
}
  
 
.custom-table-container {
    height: 75vh;        /* Fixed height */
    overflow-y: auto;     /* Vertical scrollbar */
    border: 0.25vw solid #ccc;
}


 .custom-table {
    border-collapse: collapse;
    table-layout: fixed; /* VERY IMPORTANT for percentage widths */
    width: 100%;
    font-family: Arial, sans-serif;
    margin-top: 3vh; 
    border: 1px solid grey; /* Light grey borders */
}   

   .custom-table tr:nth-child(even) {
     background-color: #D6EEEE;
     background-color: rgba(150, 212, 212, 0.4);
 }

 .custom-table td:nth-child(2) {
     text-align: left;
     
 }

  
  .custom-table th {
    background-color: #f2f2f2; /* Light gray background for header */
   /* color: #333;  */
    color:white;
    background-color: black;
    font-size: clamp(1.1rem, 1.3vw, 1.4rem); 
    font-weight: 450;
    text-align: center;
    border: 1px solid lightgrey; /* Light grey borders */
    padding: 1vw; /* Spacing inside cells */
    height: 2vh; 


  }

  .custom-table tr {
    background-color: white; /* Light gray background for header */
    border: 1px solid lightgrey; /* Light grey borders */    
    height: 1.0vh;

  }

  .custom-table td {
    /* background-color: #f2f2f2;  */ /* Light gray background for header */
    /* color: #333;  */
    font-size: clamp(0.5rem, 1.2vw, 1.3rem); 
    font-weight: 350;
    border: 1px solid lightgrey; /* Light grey borders */
    padding: 0.5vw; /* Spacing inside cells */
    text-align: center;

  }
  
  
 .custom-table tr:hover { background-color: #e6f2ff;
  }
  
 .custom-table button { 
   padding: 0.3vw; 
   height: 4vh;
   font-size: clamp(0.5rem, 1.2vw, 1.3rem); 
 }

 .custom-table td:nth-child(5),
 .custom-table td:nth-child(6) {
  text-align: right;
  font-weight: 500;
}

.custom-table tr:last-child {
  font-size: 1.1rem;
  font-weight: bold;
  background-color: #e6f2ff;
  background-color: #f0f0f0;
  border-top: 2px solid #000;
}

 .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 equal columns */
            gap: 10px;
            padding: 2px;
        }

 .grid-container > div {
  border: 0.00vw solid red;
  padding: 0.25vw;
}

.box {
            background-color: lightblue;
            padding: 40px;
            text-align: center;
            font-size: 20px;
            border: 2px solid steelblue;
        }

@media (max-width: 768px) {
.grid-container {
  display: grid;
 grid-template-columns: 1fr; /* Stack vertically */
grid-auto-flow: row;
height: 90vh;

 gap: 0.5vw;
 
}
}

.responsive-img {
  width: 100%;
  height: auto;
  object-fit: cover;
 }


  

  </style>
</head>
<body class="body_cls">


<!--  -------------------------------------------START-----------------------------------------------------------------------     -->

 
 <div class="grid-container" style="border: 0.00vw solid green;">    <!-- Grid Div -->
    <div class="box" style="border: 0.10vw solid green;">    <!-- First Inner_div -->
        <div>
        <h2>Material Management System</h2> 
        <h2>Cloud Firestore Data Base</h2>
        </div>
        <div style="text-align: center; text-decoration: underline; margin-top: 1.5vh;  font-family: calibri; font-size: clamp(0.6rem, 1.6vw, 1.6rem); Color: blue;">
        <button type="button" onclick="printInvoice()"  style="width: 8%; text-align: center">Print</button>
        </div>
        <div>
        <label style="margin-left: 1vw;">Tax %:</label>
        <input type="number" id="taxRate" value="5" step="0.01" style="width: 6%; text-align: center;">
        <button type="button" onclick="loadmyitemstable()">Recalculate</button>
        </div>
    </div> 

     <div class="box" style="border: 0.10vw solid green;">    <!-- Second Inner_div -->
        <div>
        <img src="img-inventory3.PNG" class="responsive-img rounded" style="margin-top: 2.5vh; margin-left: 0.00vw;">   
        </div> 
        
    </div>   
</div> 
    

   

<!--  -------------------------------------------------END-----------------------------------------------------------------     -->


  

  
<div style="width: 80%; ">
 <!-- Input Form -->
  <input type="number" id="nbr" placeholder="No." style="width: 7%; height: 7vh; background-color: #a5dde6; text-align: center"> 
  <input type="text" id="name" placeholder="Name" style="width: 30%; height: 7vh; background-color: #a5dde6; text-align: left">
  <input type="text" id="uis" placeholder="uis" style="width: 7%; height: 7vh; background-color: #a5dde6; text-align: center">
  <input type="number" id="qty" placeholder="Qty" style="width: 8%; height: 7vh; background-color: #a5dde6; text-align: center">
  <input type="text" id="prc" placeholder="Price" style="width: 9%; height: 7vh; background-color: #a5dde6; text-align: center">
  <input type="text" id="exp" placeholder="Expiry" style="width: 12%; height: 7vh; background-color: #a5dde6; text-align: center">
  <label>&nbsp</label>
 <button onclick="additem()"  style="width: 8%; height: 7vh;  text-align: center">Add</button>
<button onclick="updateitem()"  style="width: 9%; height: 7vh; text-align: center">Update</button>
</div>




  <!-- HTML Table For showing all records of database-->
<div class="custom-table-container">
  <table class="custom-table">
    <thead>
     
      <tr>
        <th style="text-align: center; width: 7%;">No.</th>
        <th style="text-align: center; width: 30%;">Name</th>
        <th style="text-align: center; width: 7%;">uis</th>
        <th style="text-align: center; width: 8%;">Qty</th>
        <th style="text-align: center; width: 8%;">Price</th>
        <th style="text-align: center; width: 10%;">value</th>
        <th style="text-align: center; width: 12%;">Expiry</th>
        <th style="text-align: center; width: 18%;">Action</th>
      </tr>
    </thead>
    <tbody id="itemTable">
       <tr>
        <td style="text-align: center"></td>
        <td style="text-align: left"></td>
        <td style="text-align: center"></td>
        <td style="text-align: center"></td>
        <td style="text-align: center"></td>
        <td style="text-align: center"></td>
        <td style="text-align: center"></td>
        <td style="text-align: center"></td>
      </tr>

      
     </tbody>
  </table>
 </div>
<script type="module">
  
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, 
  collection, 
  query,
  orderBy,
  addDoc, 
  getDocs, 
  deleteDoc, 
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



  // 🔴 PASTE YOUR REAL FIREBASE CONFIG HERE (from Firebase Console)
  const firebaseConfig = {
  apiKey: "AIzaSyDxjSLp6N0h9pvSG4wOrnFZJvNYtFsk-5Q",
  authDomain: "dashboard-cloud-db.firebaseapp.com",
  projectId: "dashboard-cloud-db",
  stornbrBucket: "dashboard-cloud-db.firebasestornbr.app",
  messagingSenderId: "346196944726",
  appId: "1:346196944726:web:244d43273d0b771d3e98f7"
};



  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  

  


  // 🔹 CREATE (Insert Data)
  window.additem = async function () {
    const name = document.getElementById("name").value;
    const nbr = document.getElementById("nbr").value;
    const uis = document.getElementById("uis").value;
    const qty = document.getElementById("qty").value;
    const prc = document.getElementById("prc").value;
    const exp = document.getElementById("exp").value;


    if (name === "" || nbr === "" || uis === "" || qty === "" || prc === "" || exp === "") {
      alert("Please fill all fields");
      return;
    }

    try {
      await addDoc(collection(db, "myitemstable"), {
        name: name,
        nbr: parseInt(nbr),
        qty: parseInt(qty),
        prc: parseInt(prc),
        uis: uis,
        exp: exp
   //     createdAt: new Date()
      });

      alert("item added to Cloud Firestore!");
      clearInputs();
      loadmyitemstable(); // refresh table
    } catch (error) {
      console.error("Error adding item:", error);
    }
  };

  // 🔹 READ (Load Data into Table)
async function loadmyitemstable() {

  const table = document.getElementById("itemTable");
  table.innerHTML = "";

  const collectionRef = collection(db, "myitemstable");
  const q = query(collectionRef, orderBy("nbr", "asc"));

  const querySnapshot = await getDocs(q);

  let grandTotalCents = 0; // ✅ accumulator for grand total

  querySnapshot.forEach((document) => {
    const data = document.data();
    const docId = document.id;

    // Price (cents → dollars)
    const dollarprice = formatCentsToDollars(data.prc);

    // Row total (qty × price in cents)
    const centvalue = calculatevalueincent(data.qty, data.prc);
    const dollarvalue = formatCentsToDollars(centvalue);
    // Add to grand total (SAFE integer math)
    grandTotalCents += centvalue;

 //   const displayTotal = formatCentsToDollars(grandTotalCents);

    table.innerHTML += `
      <tr>
        <td>${data.nbr}</td>
        <td>${data.name}</td>
        <td>${data.uis}</td>
        <td>${data.qty}</td>
        <td>$${dollarprice}</td>
        <td>$${dollarvalue}</td>
        <td>${data.exp}</td>
        <td>
          <button onclick="edititem('${docId}', '${data.name}', '${data.nbr}', '${data.uis}', '${data.qty}', '${data.prc}', '${data.exp}')">Edit</button>
          <button onclick="deleteitem('${docId}')">Delete</button>
        </td>
      </tr>
    `;
  });

     // ✅ Convert grand total cents to dollars
  const grandTotalDollar = formatCentsToDollars(grandTotalCents);

  // ✅ Calculate Tax (example 13%)
  const taxRate = 0.13;
  const taxCents = Math.round(grandTotalCents * taxRate);
  const taxDisplay = formatCentsToDollars(taxCents);

  // ✅ Net Total
  const netTotalCents = grandTotalCents + taxCents;
  const netTotalDisplay = formatCentsToDollars(netTotalCents);

  // ✅ Add Summary Rows (ALL TOGETHER)
  table.innerHTML += `
    <tr style="font-weight: bold; background-color: #acdbe8; border: 2px solid black; height: 7vh;">
      <td colspan="4" style="text-align: right; ">Grand Total Value</td>
      <td style="border: 1px solid black;"></td>
      <td style="text-align: right; border: 1px solid black;">$${grandTotalDollar}</td>
      <td></td>
      <td></td>
    </tr>

    <tr style="font-weight: bold; background-color: #acdbe8; border: 2px solid black; height: 7vh; ">
      <td colspan="4" style="text-align: right;">Tax Total @(13%)</td>
      <td style="border: 1px solid black;"></td>
      <td style="text-align: right; border: 1px solid black;">$${taxDisplay}</td>
      <td></td>
      <td></td>
    </tr>

    <tr style="font-weight: bold; font-size: 1.1rem; background-color: #acdbe8; border: 2px solid black; height: 7vh;">
      <td colspan="4" style="text-align: right; ">Net Total Value</td>
      <td style="border: 1px solid black;"></td>
      <td style="text-align: right; border: 1px solid black;">$${netTotalDisplay}</td>
      <td></td>
      <td></td>
    </tr>
  `;

}   // ✅ ONLY ONE closing bracket for function

function myalert() {
  alert("I am in print11 function.");

}
window.myalert = myalert; // ⭐ IMPORTANT LINE

function formatCentsToDollars(cents) {
  return (cents / 100).toFixed(2);
}

// 🔹 Itenm Value calculate func


function calculatevalueincent(qty, prc) {
  const q = parseInt(qty) || 0;
  const p = parseInt(prc) || 0;
  return q * p; // stays in cents (safe, no floating errors)
}

// Tax calculation functions

function calculateTaxCents(grandTotalCents, taxPercent) {
  const taxRate = parseFloat(taxPercent) || 0;
  return Math.round((grandTotalCents * taxRate) / 100);
}

function calculateNetTotalCents(grandTotalCents, taxCents) {
  return grandTotalCents + taxCents;
}







  // 🔹 DELETE (Remove Record)
  window.deleteitem = async function (id) {
    await deleteDoc(doc(db, "myitemstable", id));
    alert("item deleted from Firestore");
    clearInputs();
    loadmyitemstable();
  };

  // Clear input fields
  function clearInputs() {
    document.getElementById("name").value = "";
    document.getElementById("nbr").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("prc").value = "";
    document.getElementById("exp").value = "";
    document.getElementById("uis").value = "";
    

  }

// Fill inputs when Edit button is clicked
window.edititem = function (id, name, nbr, uis, qty, prc, exp) {
  
  document.getElementById("name").value = name;
  document.getElementById("nbr").value = nbr;
  document.getElementById("uis").value = uis;
  document.getElementById("qty").value = qty;
  document.getElementById("prc").value = prc;
  document.getElementById("exp").value = exp;
  


  // Store document ID for update
  window.currentEditId = id;
};

// Update record in Firestore
window.updateitem = async function () {
  if (!window.currentEditId) {
    alert("Please select a record to edit first.");
    return;
  }

  const name = document.getElementById("name").value;
  const nbr = document.getElementById("nbr").value;
  const uis = document.getElementById("uis").value;
  const qty = document.getElementById("qty").value;
  const prc = document.getElementById("prc").value;
  const exp = document.getElementById("exp").value;



  try {
    await updateDoc(doc(db, "myitemstable", window.currentEditId), {
      name: name,
      nbr: parseInt(nbr),
      qty: parseInt(qty),
      prc: parseInt(prc),
      exp: exp,
      uis: uis
    });

    alert("item updated successfully!");
    window.currentEditId = null;
     clearInputs();
    loadmyitemstable();
  } catch (error) {
    console.error("Update error:", error);
  }
};


  // Auto-load data when pnbr opens (like SQL SELECT * FROM table)
  
  loadmyitemstable();



//  PRINT FUNCTION START

function printInvoice() {
  alert("I am in print function.");

  const table = document.getElementById("itemTable").innerHTML;

  const printWindow = window.open('', '', 'width=900,height=700');

  printWindow.document.write(`
    <html>
      <head>
        <title>Invoice</title>
        <style>
          body {
            font-family: Arial, sans-serif;
            padding: 20px;
          }

          h2 {
            text-align: center;
            margin-bottom: 20px;
          }

          table {
            width: 100%;
            border-collapse: collapse;
          }

          th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
          }

          th {
            background-color: #f2f2f2;
          }

          .right {
            text-align: right;
          }

          .center {
            text-align: center;
          }

          .summary-row {
            font-weight: bold;
          }

          @media print {
            button {
              display: none;
            }
          }
        </style>
      </head>
      <body>

        <h2>INVOICE</h2>

        <p>
          <strong>Date:</strong> ${new Date().toLocaleDateString()}<br>
          <strong>Invoice #:</strong> INV-${Date.now()}
        </p>

        <table>
          ${table}
        </table>

        <br>
        <p style="text-align:center;">Thank you for your business!</p>

      </body>
    </html>
  `);

  printWindow.document.close();
  printWindow.focus();
  printWindow.print();
  printWindow.close();
}

window.printInvoice = printInvoice; // ⭐ IMPORTANT LINE



//  PRINT FUNCTION END



</script>

</body>
</html>
